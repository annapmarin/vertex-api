services:
db:
    image: mariadb:10.11
    restart: always
    environment:
    MYSQL_DATABASE: ${DB_NAME}
    MYSQL_USER: ${DB_USER}
    MYSQL_PASSWORD: ${DB_PASSWORD}
    MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
    - "3306:3306"
    volumes:
    - db_data:/var/lib/mysql

web:
    image: annamnesias/vertex-api:latest
    restart: always
    ports:
    - "8000:8000"
    env_file:
    - .env
    depends_on:
    - db

volumes:
db_data: